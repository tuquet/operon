name: operon

networks:
  operon-net:
    driver: bridge

volumes:
  daemon_data:
  bugsink_data:

services:
  # ============================================================================
  # 1. CORE STACK (Default): Daemon API & Web Console
  # ============================================================================
  daemon:
    container_name: daemon
    build:
      context: .
      dockerfile: crates/cli/deploy/Dockerfile
      args:
        - HTTP_PROXY=${BUILD_HTTP_PROXY:-}
        - HTTPS_PROXY=${BUILD_HTTPS_PROXY:-}
        - NO_PROXY=localhost,127.0.0.1
    command: ["worker", "start", "-H", "0.0.0.0", "-p", "8765"]
    restart: unless-stopped
    ports:
      - "${DAEMON_PORT:-8765}:8765"
    environment:
      - DAEMON_HOST=0.0.0.0
      - DAEMON_PORT=8765
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - RUST_LOG=${RUST_LOG:-info}
      - DATA_DIR=/home/operon/.operon
    volumes:
      - daemon_data:/home/operon/.operon
    networks:
      - operon-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  console:
    container_name: console
    build:
      context: ./console
      dockerfile: deploy/Dockerfile
      args:
        - HTTP_PROXY=${BUILD_HTTP_PROXY:-}
        - HTTPS_PROXY=${BUILD_HTTPS_PROXY:-}
        - NO_PROXY=localhost,127.0.0.1
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5666}:80"
    environment:
      - VITE_PORT=80
      - VITE_DAEMON_PORT=${DAEMON_PORT:-8765}
      - VITE_SUPABASE_URL=${SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      - VITE_BUGSINK_DSN=${VITE_BUGSINK_DSN:-}
    depends_on:
      daemon:
        condition: service_healthy
    networks:
      - operon-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 2. OPTIONAL: Technical Documentation Portal (--profile docs, --profile all)
  # ============================================================================
  docs:
    container_name: docs
    profiles:
      - docs
      - all
    build:
      context: ./docs
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-3333}:80"
    networks:
      - operon-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============================================================================
  # 3. OPTIONAL: Telegram ChatOps Bot (--profile ops, --profile all)
  # ============================================================================
  bot:
    container_name: bot
    profiles:
      - ops
      - all
    build:
      context: ./bot
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
    networks:
      - operon-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # 4. OPTIONAL: Self-hosted Bugsink Tracker (--profile telemetry, --profile all)
  # ============================================================================
  bugsink:
    container_name: bugsink
    profiles:
      - telemetry
      - all
    image: bugsink/bugsink:latest
    restart: unless-stopped
    ports:
      - "${BUGSINK_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=${BUGSINK_SECRET_KEY:-<GENERATE_RANDOM_50_CHARS>}
      - CREATE_SUPERUSER=${BUGSINK_ADMIN_CREDENTIALS:-admin@operon.local:admin123456}
      - BUGSINK_BASE_URL=http://localhost:${BUGSINK_PORT:-8000}
      - CORS_ALLOWED_ORIGINS=http://localhost:${VITE_PORT:-5666},http://127.0.0.1:${VITE_PORT:-5666}
    volumes:
      - bugsink_data:/data
    networks:
      - operon-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
