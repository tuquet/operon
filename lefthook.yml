pre-commit:
  parallel: false
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    oxlint:
      glob: "console/**/*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts}"
      run: cd console && pnpm exec oxlint --fix --type-aware --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "console/**/*.{js,jsx,ts,tsx,vue,cjs,mjs,cts,mts,json,jsonc}"
      run: cd console && pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
