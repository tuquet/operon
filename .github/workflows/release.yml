name: "Release: opn Local Bridge"

on:
  push:
    tags:
      - 'core-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read toolchain pin
        id: pin
        run: echo "rust=$(sed -n 's/^rust-toolchain = "\(.*\)"/\1/p' Cargo.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.rust }}
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
          cache-workspace-crates: true

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test
        run: cargo test --workspace --lib --bins --tests

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: opn.exe
            asset: opn-windows-x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: opn
            asset: opn-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: opn
            asset: opn-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: opn
            asset: opn-macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read toolchain pin
        id: pin
        shell: bash
        run: echo "rust=$(sed -n 's/^rust-toolchain = "\(.*\)"/\1/p' Cargo.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.rust }}
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
          cache-workspace-crates: true
          key: ${{ matrix.target }}

      - name: Build opn binary
        shell: bash
        run: |
          cargo build --release --bin opn --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: core/dist/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Copy Installers & Compute Checksums
        run: |
          cp core/crates/cli/install.ps1 release-assets/install.ps1
          cp core/crates/cli/install.sh release-assets/install.sh
          cd release-assets
          sha256sum opn-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --latest --generate-notes release-assets/*
