name: "CI: rust workspace"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types:
      - run-ci

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 0. PATH FILTER TO SKIP UNNECESSARY HEAVY JOBS
  # ============================================================================
  changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Path Filters
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            rust:
              - 'core/crates/**'
              - 'core/Cargo.toml'
              - 'core/Cargo.lock'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker-compose.yml'
              - '**/deploy/**'
              - '.github/workflows/ci.yml'

  # ============================================================================
  # 1. SECURITY: GITLEAKS SECRET SCANNER
  # ============================================================================
  secret-scan:
    name: Secret & Credential Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 2. RUST WORKSPACE VERIFICATION
  # ============================================================================
  rust-check:
    name: Rust Check, Format & Tests
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read toolchain pin and normalize file timestamps for Cargo cache
        id: pin
        run: |
          echo "rust=$(sed -n 's/^rust-toolchain = "\(.*\)"/\1/p' Cargo.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"
          COMMIT_TS=$(git show -s --format=%cI HEAD)
          git ls-files -z | xargs -0 touch -c -d "$COMMIT_TS"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.pin.outputs.rust }}
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core -> target
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test
        run: cargo test --workspace --lib --bins --tests

  # ============================================================================
  # 3. DOCKER COMPOSE CONFIG VALIDATION
  # ============================================================================
  docker-check:
    name: Docker Compose Validation
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
