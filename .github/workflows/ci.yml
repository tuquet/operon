name: "CI: Operon Mesh Engine & Subsystems"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_coverage:
        description: 'Generate and publish test coverage report'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - run-ci
      - check-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 0. PATH FILTER TO SKIP UNNECESSARY HEAVY JOBS
  # ============================================================================
  changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-rust-ci.yml'
            frontend:
              - 'console/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker-compose.yml'
              - '**/deploy/**'
              - '.github/workflows/ci.yml'

  # ============================================================================
  # 1. SECURITY: GITLEAKS SECRET SCANNER
  # ============================================================================
  secret-scan:
    name: Secret & Credential Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ============================================================================
  # 2. RUST WORKSPACE VERIFICATION
  # ============================================================================
  rust-check:
    name: Rust Check, Format & Tests
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo Test
        run: cargo test --workspace

  # ============================================================================
  # 3. CONSOLE FRONTEND TYPECHECK & LINT
  # ============================================================================
  frontend-check:
    name: Console Frontend Check
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Dependencies
        run: |
          cd console
          pnpm install --frozen-lockfile

      - name: Frontend Typecheck
        run: |
          cd console
          pnpm --filter @operon/workstation typecheck

  # ============================================================================
  # 4. DOCKER COMPOSE CONFIG VALIDATION
  # ============================================================================
  docker-check:
    name: Docker Compose Validation
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config -q
